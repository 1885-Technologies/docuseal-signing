app = "docuseal-signing-1885"
primary_region = "fra"
[build]
  dockerfile = "signing_api/Dockerfile"
[env]
  RACK_ENV = "production"
  SIGNING_DATA_DIR = "/data/docuseal/signing"
[[mounts]]
  source = "signing_data"
  destination = "/data/docuseal/signing"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
